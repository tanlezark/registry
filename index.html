<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our wedding registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--ink:#1f2a24;--muted:#66706a;--line:#d9ded6;--accent:#5b2a4a;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171c19;--ink:#e8ece6;--muted:#95a09a;--line:#2c3630;--accent:#d9a3c6;--accent-ink:#171c19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Instrument Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:4rem 1.5rem 5rem}
h1{font:600 clamp(2.4rem,8vw,3.6rem)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0 0 1.25rem}
.intro{color:var(--muted);max-width:52ch;margin:0 0 3rem}
h2{font:600 1.05rem/1.3 "Instrument Sans",system-ui,sans-serif;color:var(--muted);margin:2.75rem 0 .75rem}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line);padding:1.1rem 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.name{font:600 1.25rem/1.3 Fraunces,Georgia,serif}
.note{color:var(--muted);font-size:.95rem;margin:.15rem 0 0}
button{font:500 .95rem "Instrument Sans",system-ui,sans-serif;border-radius:999px;padding:.5rem 1.1rem;cursor:pointer;white-space:nowrap;border:1px solid var(--accent);background:transparent;color:var(--accent)}
button:hover{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.solid{background:var(--accent);color:var(--accent-ink)}
.taken .name,.taken .note{text-decoration:line-through;color:var(--muted);font-weight:400}
.link{display:inline-block;margin-top:.2rem;font-size:.9rem;color:var(--accent)}
.tag{color:var(--muted);font-size:.95rem;white-space:nowrap}
form{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
input,textarea{flex:1 1 200px;font:inherit;font-size:.95rem;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
textarea{flex-basis:100%;resize:vertical;min-height:4.5rem}
.msg{color:var(--muted);font-size:.9rem;margin-top:.5rem}
footer{margin-top:2.5rem;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>G &amp; T</h1>
<p class="intro">GIVE US STUFF</p>
<div id="list"></div>
<p class="msg" id="status" role="status"></p>
<footer>Thank you. We are so glad you are coming.</footer>
</main>
<script>
// 1. Google Form and Sheet settings. Leave FORM_URL empty to preview locally.
const FORM_URL      = "https://docs.google.com/forms/d/e/1FAIpQLSeWVL5mlzHtPsGpulaXCtoU-vtHiCry53Kaix3duR2kXu0umg/formResponse";
const ENTRY_ITEM    = "entry.468522525";
const ENTRY_NAME    = "entry.1905366713";
const ENTRY_NOTES   = "entry.1819125415";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQn4-SZ7JhozDiIcdt-UnzqwP_S7ISGYS91qZ7rl0FrgQplcwOrh4aKyfq_FWwvBbR7wtTLCxVyIevY/pub?gid=2135754539&single=true&output=csv";

// 2. Edit your items here. Each id must be unique and should not change once guests start claiming.
const ITEMS = [
  // group, id, name, note (the blurb), link (optional), multi (true = many people can claim it)
  {group:"Kitchen", id:"microwave",  name:"Microwave",  note:"Microwave go brrrrr"},
  {group:"Kitchen", id:"dinnerset",  name:"Dinner set"},
  {group:"Kitchen", id:"cutlery",    name:"Cutlery"},
  {group:"Kitchen", id:"airfryer",   name:"Air fryer"},
  {group:"Kitchen", id:"knives",     name:"Knife block and knives"},
  {group:"Kitchen", id:"boards",     name:"Cutting boards"},
  {group:"Kitchen", id:"tablecloth", name:"Table cloths"},
  {group:"Kitchen", id:"standmixer", name:"Stand mixer", note:"Very expensive. Definitely not essential."},
  {group:"Loungeroom", id:"tv",        name:"TV"},
  {group:"Loungeroom", id:"bookshelf", name:"Heirloom quality bookshelf"},
  {group:"Bathroom", id:"duck", name:"Rubber duck", note:"For all our bathroom needs."},
  {group:"Outdoor", id:"seating", name:"Outdoor seating arrangement", note:"We have a whole outdoor undercover patio"},
  {group:"Outdoor", id:"tent",    name:"Tent", note:"We go camp. Is good tend. Camp long time. No go home.", link:"https://www.snowys.com.au/instant-up-4p-gold-series-evo-tent"},
  {group:"Outdoor", id:"outdooracc", name:"Outdoor accessories", note:"Fun things for outside!", multi:true},
  {group:"Around the house", id:"stickvac", name:"Stick vacuum"},
  {group:"Or chip in", id:"dishwasherfund", name:"Dishwasher fund", note:"gib cash money dollarbucks", multi:true}
];

const list = document.getElementById("list"), statusEl = document.getElementById("status");
let claimed = new Set();

function say(t){ statusEl.textContent = t; }

function render(){
  list.innerHTML = "";
  const groups = [];
  for (const it of ITEMS){
    let g = groups.find(x => x.name === it.group);
    if (!g){ g = {name: it.group, items: []}; groups.push(g); }
    g.items.push(it);
  }
  for (const g of groups){
    const h = document.createElement("h2"); h.textContent = g.name; list.append(h);
    const ul = document.createElement("ul"); list.append(ul);
    for (const it of g.items){
      const li = document.createElement("li");
      const taken = !it.multi && claimed.has(it.id);
      if (taken) li.className = "taken";
      li.innerHTML = '<div class="row"><div class="info"><div class="name"></div><p class="note"></p></div></div>';
      li.querySelector(".name").textContent = it.name;
      const note = li.querySelector(".note");
      if (it.note) note.textContent = it.note; else note.remove();
      if (it.link){
        const a = document.createElement("a"); a.className = "link"; a.href = it.link;
        a.target = "_blank"; a.rel = "noopener"; a.textContent = "See an example";
        li.querySelector(".info").append(a);
      }
      const row = li.querySelector(".row");
      if (taken){
        const t = document.createElement("span"); t.className = "tag"; t.textContent = "Taken"; row.append(t);
      } else {
        const b = document.createElement("button"); b.textContent = it.multi ? "I'll chip in" : "I'll get this";
        b.onclick = () => openForm(li, it, b); row.append(b);
      }
      ul.append(li);
    }
  }
}

function openForm(li, it, btn){
  btn.hidden = true;
  const f = document.createElement("form");
  f.innerHTML = '<input aria-label="Your name" placeholder="Your name" autocomplete="name"><textarea aria-label="A note for us (optional)" placeholder="A note for us (optional)"></textarea><button class="solid" type="submit">Confirm</button><button type="button">Cancel</button>';
  const [input, notes, ok, cancel] = f.elements;
  cancel.onclick = () => { f.remove(); btn.hidden = false; };
  f.onsubmit = async e => {
    e.preventDefault(); ok.disabled = true; ok.textContent = "Saving";
    const result = await claim(it, input.value.trim(), notes.value.trim());
    if (result === "ok") say(it.multi ? "Thank you. We have noted it." : "Thank you. " + it.name + " is marked as yours.");
    else if (result === "taken") say("Someone just claimed " + it.name + ". Please pick another.");
    else { say("That did not save. Please try again in a moment."); f.remove(); btn.hidden = false; return; }
    render();
  };
  li.append(f); input.focus();
}

const KEY = "registry-mine";
function mine(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; } }
function remember(id){ try { localStorage.setItem(KEY, JSON.stringify([...new Set([...mine(), id])])); } catch(e){} }

async function claim(it, name, notes){
  if (!it.multi) claimed.add(it.id);
  if (!FORM_URL) return "ok";
  try {
    const body = new URLSearchParams();
    body.set(ENTRY_ITEM, it.id); body.set(ENTRY_NAME, name); body.set(ENTRY_NOTES, notes);
    await fetch(FORM_URL, {method:"POST", mode:"no-cors", body});
    if (!it.multi) remember(it.id);
    return "ok";
  } catch(e){ claimed.delete(it.id); return "error"; }
}

function parseCSV(t){
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i+1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ r.push(c); c = ""; }
    else if (ch === "\n"){ r.push(c); rows.push(r); r = []; c = ""; }
    else if (ch !== "\r") c += ch;
  }
  if (c || r.length){ r.push(c); rows.push(r); }
  return rows;
}

async function load(){
  claimed = new Set(mine());
  render();
  if (!SHEET_CSV_URL) return;
  try {
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
    const rows = parseCSV(await (await fetch(url)).text()).slice(1);
    claimed = new Set([...mine(), ...rows.map(r => (r[1] || "").trim()).filter(Boolean)]);
    render();
  } catch(e){ say("Could not check what has been taken. Please refresh."); }
}
load();
</script>
</body>
</html>
